server {
    listen 80;
    server_name radar.clasure.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/radar-acme; }
    location / { return 301 https://radar.clasure.com.br$request_uri; }
}

server {
    listen 443 ssl;
    server_name radar.clasure.com.br;
    ssl_certificate /etc/letsencrypt/live/radar.clasure.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.clasure.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location ~* ^/(?:instance|backups|banco_de_dados|\.git|\.env|deploy)(?:/|$) { return 404; }
    location ~* \.(?:db|sqlite|sqlite3|key|pem|bak|py|tar\.gz)$ { return 404; }
    location = /login {
        limit_req zone=radar_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5056;
        include /etc/nginx/radar-proxy.inc;
    }
    location / {
        proxy_pass http://127.0.0.1:5056;
        include /etc/nginx/radar-proxy.inc;
    }
}
