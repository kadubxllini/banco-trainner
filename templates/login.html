<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Entrar · RADAR</title><link rel="icon" href="{{ url_for('static',filename='img/logosite.png',v='yellow') }}"><link rel="stylesheet" href="{{ url_for('static',filename='radar.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='login.css') }}"><script src="{{ url_for('static',filename='security.js') }}" defer></script></head>
<body class="auth-page"><main class="auth-card"><a class="auth-brand" href="/login"><img src="{{ url_for('static',filename='img/logo_clara.png') }}" alt="Trainner RH"><span>RADAR<small>TRAINNER RH</small></span></a><div class="auth-heading"><h1>Acesse seu painel</h1><p>Entre para acompanhar empresas e processos.</p></div>{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}<form action="/login" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="username" maxlength="254" required autofocus><label for="password">Senha</label><input type="password" id="password" name="password" autocomplete="current-password" maxlength="1024" required><button type="submit" class="primary">Entrar</button></form><p class="auth-footer">Acesso restrito à equipe autorizada.</p></main></body></html>
