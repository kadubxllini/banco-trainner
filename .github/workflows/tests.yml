name: Testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt tzdata
      - name: Preparar banco sintético
        run: python scripts/prepare_test_database.py
      - name: Testar acesso e relatório diário
        run: python -m unittest test_security.SecurityTests test_daily_report.DailyReportTests -v
